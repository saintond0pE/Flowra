<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowra OS - Login</title>
    <style>
        /* Neo-Brutalist Design to match the Dashboard */
        :root {
            --bg-color: #f4f4f4;
            --surface-color: #ffffff;
            --border-color: #111111;
            --text-color: #111111;
            --accent-color: #ff3c00;
            --font-family: 'Inter', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--surface-color);
            border: 3px solid var(--border-color);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 8px 8px 0 var(--border-color);
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        p {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #555;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 3px solid var(--border-color);
            font-size: 14px;
            background: var(--bg-color);
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            background: var(--surface-color);
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            background: var(--accent-color);
            color: #fff;
            border: 3px solid var(--border-color);
            padding: 16px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--border-color);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 var(--border-color);
        }

        .error-msg {
            color: var(--accent-color);
            font-weight: 800;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-card">
        <h1>Flowra OS</h1>
        <p>Authorized access only.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" id="email" placeholder="admin@flowra.ai" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required>
            </div>
            
            <button type="submit" class="btn" id="loginBtn">LOG IN</button>
            <div id="errorMsg" class="error-msg">Login failed. Please verify credentials.</div>
        </form>
    </div>

    <script>
        const allowedEmails = ["iblamechira@gmail.com", "rudraprakash18@outlook.com"];

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!allowedEmails.includes(email)) {
                errorMsg.innerText = "Email not authorized.";
                errorMsg.style.display = "block";
                return;
            }
            if (password !== "flowra.ai") {
                errorMsg.innerText = "Password is wrong.";
                errorMsg.style.display = "block";
                return;
            }

            btn.innerText = "AUTHENTICATING...";
            errorMsg.style.display = "none";

            // Set a 5-day persistent local session
            const expiry = new Date().getTime() + (5 * 24 * 60 * 60 * 1000);
            localStorage.setItem('flowra_session', JSON.stringify({ email, expiry }));

            btn.innerText = "SUCCESS";
            window.location.href = "/dashboard.html";
        });
    </script>
</body>
</html>
